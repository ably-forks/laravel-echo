name: package

# Builds the npm package from a clean checkout and verifies it. It never publishes: a maintainer downloads
# the `npm-package` artifact and publishes that exact tarball by hand (see "Release Process" in .github/README.md).

on:
  push:
    tags:
      - 'ably-echo-*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. ably-echo-1.1.1'
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    env:
      # The release tag this run is for. Empty on pull requests, where only the build and verification run.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the package version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Check the tag matches the package version
        if: env.RELEASE_TAG != ''
        run: |
          if [ "$RELEASE_TAG" != "ably-echo-$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $VERSION (expected ably-echo-$VERSION)"
            exit 1
          fi

      - name: Build, pack and verify the tarball
        run: npm run release:pack

      - name: Write the checksum
        run: shasum -a 512 "ably-laravel-echo-$VERSION.tgz" > "ably-laravel-echo-$VERSION.tgz.sha512"

      - name: Upload the tarball and checksum
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ably-laravel-echo-${{ env.VERSION }}.tgz
            ably-laravel-echo-${{ env.VERSION }}.tgz.sha512
          if-no-files-found: error
          retention-days: 90 # the maximum on most plans

      - name: Summarize
        run: |
          {
            echo "### npm package"
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`${RELEASE_TAG:-none (build and verification only)}\`"
            echo "- Tarball: \`ably-laravel-echo-$VERSION.tgz\` ($(wc -c < "ably-laravel-echo-$VERSION.tgz") bytes)"
            echo "- sha512: \`$(cut -d' ' -f1 "ably-laravel-echo-$VERSION.tgz.sha512")\`"
            echo "- npm integrity: \`sha512-$(openssl dgst -sha512 -binary "ably-laravel-echo-$VERSION.tgz" | base64 | tr -d '\n')\` (npm shows this as dist.integrity after publishing)"
          } >> "$GITHUB_STEP_SUMMARY"
