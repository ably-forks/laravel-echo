name: publish

# Publishes @ably/laravel-echo, -react, -vue and -svelte (one lockstep version) when a GitHub release is published:
# release.sh creates it for the tag ably-echo-<version>. A prerelease (X.Y.Z-rc.N) goes to the npm dist-tag `next`,
# a release (X.Y.Z) to `latest`. Publishing uses npm trusted publishing (OIDC) with provenance; there is no npm token.
# A manual run (workflow_dispatch) runs the `verify` job only and never publishes.
# A release event runs this file as it is at the tag's commit: a 1.x release tagged on master uses master's workflows.
on:
  release:
    # 'published' also fires for prereleases; 'released' would skip the release candidates.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Builds, tests and audits the release commit, packs the four packages and checks each tarball, then hands
    # exactly those tarballs to the publish job.
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.guard.outputs.version }}
      dist_tag: ${{ steps.guard.outputs.dist_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      # Before anything is packed or published: the tag must be ably-echo-<version>, all four packages must be at
      # <version>, and the prerelease flag must match it (X.Y.Z-rc.N: prerelease, dist-tag next; X.Y.Z: release,
      # latest). The tag and the flag come in through the environment, never interpolated into the script.
      - name: Check the release tag, version and npm dist-tag
        id: guard
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash scripts/release-guard.sh "$RELEASE_TAG" "$RELEASE_PRERELEASE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # An explicit build: lifecycle scripts such as prepublishOnly are never relied on.
      - name: Build the core, then the adapters
        run: pnpm build

      - name: Execute the tests (core unit and Ably tests, React, Vue and Svelte)
        run: pnpm test

      - name: Smoke-test the built bundles (core and adapters)
        run: pnpm -r --no-bail --if-present run test:bundles

      - name: Audit dependencies
        run: pnpm audit

      - name: Test the release helpers
        run: bash scripts/test-release-lib.sh

      # On a manual run both variables are empty, and the version comes from packages/laravel-echo/package.json.
      - name: Pack the four packages and check each tarball
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/check-release-tarballs.mjs

      - name: Upload the checked tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: release-tarballs/*.tgz
          if-no-files-found: error

  publish:
    # Publishes the tarballs that `verify` checked, one package at a time, the core first. If a leg fails after the
    # core was published, don't unpublish: fix the cause and re-run the failed jobs. A package version that is already
    # on npm is skipped, so a re-run only publishes what is missing.
    needs: verify
    # Only for a GitHub release of this repository with a fork-style tag; never on a manual run.
    if: github.event_name == 'release' && github.repository == 'ably-forks/laravel-echo' && startsWith(github.event.release.tag_name, 'ably-echo-')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance

    strategy:
      max-parallel: 1
      matrix:
        include:
          # Core first. Explicit names: the core glob must not match the adapters' tarballs.
          - { package: laravel-echo, tgz: 'ably-laravel-echo-[0-9]*.tgz' }
          - { package: react, tgz: 'ably-laravel-echo-react-[0-9]*.tgz' }
          - { package: vue, tgz: 'ably-laravel-echo-vue-[0-9]*.tgz' }
          - { package: svelte, tgz: 'ably-laravel-echo-svelte-[0-9]*.tgz' }

    steps:
      # No checkout and no install: this job only needs npm and the checked tarballs.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: |
          npm_is_recent() {
            node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
          }
          npm --version
          if ! npm_is_recent; then
            npm install --global npm@^11.5.1
            npm --version
            if ! npm_is_recent; then
              echo "::error::npm $(npm --version) is older than 11.5.1, which trusted publishing needs."
              exit 1
            fi
          fi

      - name: Download the checked tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: release-tarballs

      - name: Publish ${{ matrix.package }} to npm
        env:
          TGZ: ${{ matrix.tgz }}
          # From the release guard in `verify`: derived from the version and checked against the prerelease flag.
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          if ! { [ "$DIST_TAG" = next ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; } &&
            ! { [ "$DIST_TAG" = latest ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; }; then
            echo "::error::Unexpected version '$VERSION' or dist-tag '$DIST_TAG' from the release guard."
            exit 1
          fi
          shopt -s nullglob
          tarballs=(release-tarballs/$TGZ)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball for $TGZ, found ${#tarballs[@]}."
            exit 1
          fi
          tarball=${tarballs[0]}
          name=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          version=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$version" != "$VERSION" ]; then
            echo "::error::$tarball is version $version, not $VERSION."
            exit 1
          fi
          sha512sum "$tarball"
          if [ -n "$(npm view "$name@$version" version 2> /dev/null)" ]; then
            echo "$name@$version is already on npm; skipping."
            exit 0
          fi
          npm publish "$tarball" --access public --provenance --tag "$DIST_TAG"
