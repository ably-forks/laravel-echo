name: tests

on:
  push:
    branches:
      - master
      # '*.x' also matches the 2.x branch.
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    # The core (@ably/laravel-echo) and the React, Vue and Svelte adapters: build, lint, format, type checks, unit tests, bundle smoke tests and the dependency audit.
    runs-on: ubuntu-latest

    strategy:
      # One failing Node version must not cancel the other.
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # Vite+ needs Node ^22.18 or ^24.11: resolve the newest release, not an older cached one.
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before lint: the adapters' type-aware lint and compat files resolve the core's built declarations.
      - name: Build the core, then the adapters (JS bundles and declarations)
        run: pnpm build

      # The release checks, as the release workflow runs them before staging: the four versions and the
      # adapters' peer range agree, and every main/module/types/exports file is in each packed tarball.
      - name: Check the package versions
        run: pnpm run check:versions

      - name: Test the release script
        run: node --test scripts/release.test.js

      - name: Pack the four packages and check each tarball
        run: node scripts/release.js check --pack

      - name: Lint and type check
        run: pnpm run lint

      - name: Check formatting
        run: pnpm exec vp fmt --check

      - name: Type-check upstream laravel-echo and @laravel/echo-react, -vue and -svelte usage against the built declarations
        run: pnpm -r --no-bail --if-present run test:compat

      # Enforces the core's type-level tests (expectTypeOf, @ts-expect-error), which are no-ops at runtime.
      - name: Type-check the core's sources and tests
        run: pnpm --filter @ably/laravel-echo exec tsc --noEmit -p tsconfig.json

      - name: Type-check the adapters' sources and tests
        run: pnpm --filter "@ably/laravel-echo-*" exec tsc --noEmit -p tsconfig.json

      # The root script runs every package with --no-bail, so one failing package does not hide the others' results.
      - name: Execute the tests (core unit and Ably tests, React, Vue and Svelte)
        run: pnpm test

      - name: Smoke-test the built bundles (core and adapters)
        run: pnpm -r --no-bail --if-present run test:bundles

      - name: Audit dependencies
        run: pnpm audit

  sandbox:
    # The core's live-sandbox suites. Each test file creates its own sandbox app, so no secrets or keys are needed.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    env:
      # mau.test.ts soft-skips outside CI; in CI it must run.
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The vitest `sandbox` project caps maxWorkers at 4 to limit the load on the sandbox.
      - name: Execute the live-sandbox tests
        run: pnpm --filter @ably/laravel-echo run test:sandbox

  browser-build:
    # tests/ably against @ably/pubsub-device's browser build (dist/index.js), which browser users actually ship (D-09). It uses the live sandbox.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute tests against the browser build
        run: pnpm --filter @ably/laravel-echo run test:browser-build
