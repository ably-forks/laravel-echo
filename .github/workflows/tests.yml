name: tests

# Interim pnpm workflow: Phase 14 adds SHA pins, permissions, lint and the adapter jobs.

on:
  pull_request:
  push:
    branches:
      - master
      - '*.x'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      # The suite uses the live Ably sandbox (one sandbox app per leg); one flaky leg must not cancel the others.
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Vite+ needs Node ^22.18 or ^24.11: resolve the newest release, not an older cached one.
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the core (JS bundles; declarations are built once the type fixes land)
        run: pnpm --filter @ably/laravel-echo run build:js

      - name: Execute the core tests
        run: pnpm --filter @ably/laravel-echo exec vp test --run tests/echo.test.ts tests/util tests/channel tests/connector

      - name: Smoke-test the built bundles (self-contained IIFE, ESM/CJS export surface)
        if: ${{ false }} # re-enabled by Phase 04 (Vitest bundles project)
        run: pnpm --filter @ably/laravel-echo run test:bundles

  browser-build:
    # tests/ably against @ably/pubsub-device's browser build (dist/index.js), which users actually ship (R15).
    if: ${{ false }} # re-enabled by Phase 04 (Vitest browser-build project)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute tests against the browser build
        run: pnpm --filter @ably/laravel-echo run test:browser-build
