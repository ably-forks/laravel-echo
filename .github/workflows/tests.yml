name: tests

on:
  pull_request:
  push:
    branches:
      - master
      - '*.x'

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      # The suite uses the live Ably sandbox (one sandbox app per leg); one flaky leg must not cancel the others.
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Execute tests
        run: npm test

      - name: Run build
        run: npm run build
