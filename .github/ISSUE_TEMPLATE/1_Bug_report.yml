name: Bug Report
description: "Report something that's broken."
body:
  - type: markdown
    attributes:
      value: "This repository is Ably's fork of Laravel Echo (`@ably/laravel-echo`). Use it to report bugs in the Echo client (the Ably connector) or its documentation. For support questions, go to [Ably support](https://ably.com/support). For problems on the Laravel server side, use [ably/laravel-broadcaster](https://github.com/ably/laravel-broadcaster/issues)."
  - type: input
    attributes:
      label: Echo Version
      description: Provide the `@ably/laravel-echo` version that you are using.
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    attributes:
      label: Laravel Version
      description: Provide the Laravel version that you are using.
      placeholder: 10.4.1
    validations:
      required: true
  - type: input
    attributes:
      label: PHP Version
      description: Provide the PHP version that you are using.
      placeholder: 8.1.4
    validations:
      required: true
  - type: input
    attributes:
      label: NPM Version
      description: Provide the NPM version that you are using.
      placeholder: 7.2.3
    validations:
      required: true
  - type: input
    attributes:
      label: Database Driver & Version
      description: If applicable, provide the database driver and version you are using.
      placeholder: "MySQL 8.0.31 for macOS 13.0 on arm64 (Homebrew)"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Description
      description: Provide a detailed description of the issue you are facing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Provide detailed steps to reproduce your issue. If necessary, please provide a GitHub repository to demonstrate your issue using `laravel new bug-report --github="--public"`.
    validations:
      required: true
      

